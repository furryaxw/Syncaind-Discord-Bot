<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{css_url}}">
</head>
<body>
  <main>
    <h1>{{title}}</h1>
    {{description_block}}
    <form method="post" action="{{action}}" enctype="multipart/form-data">
      {{csrf_field}}
      {{fields}}
      <button type="submit">{{submit_label}}</button>
    </form>
  </main>
</body>
</html>
